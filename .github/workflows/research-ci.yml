name: Research CI

on:
  push:
    branches:
      - "research/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Full repository verification
        run: npm run verify
      - name: Reconciliation benchmark
        run: npm run research:benchmark
      - name: Protocol-search baseline study
        run: npm run research:baselines:write
      - name: Selection-aware 16-world analysis
        run: npm run statistics:family:write
      - name: Write machine-readable research artifacts
        if: always()
        run: |
          npm run research:benchmark:write
          npm run certificate:v2:write
      - name: Replay portable certificate
        if: always()
        run: npm run verify:certificate -- data/certificates/canonical-v2.json
      - name: Build commit-pinned source snapshot
        if: always()
        run: git archive --format=zip --output=mpw-source-${{ github.sha }}.zip HEAD
      - name: Upload research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mpw-research-artifacts-${{ github.sha }}
          path: |
            data/analysis/canonical-family-inference.json
            data/benchmarks/reconciliation-results.json
            data/benchmarks/protocol-search-baselines.json
            data/benchmarks/protocol-search-baselines-summary.json
            data/certificates/canonical-v2.json
            mpw-source-${{ github.sha }}.zip
          if-no-files-found: error
