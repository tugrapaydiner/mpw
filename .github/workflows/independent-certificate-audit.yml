name: Independent Certificate Audit

on:
  push:
    branches:
      - "research/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: independent-certificate-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-audit-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Mint canonical v2 certificate
        run: npm run certificate:v2:write
      - name: Independent Python audit verification
        run: python3 scripts/verify-certificate-audit.py data/certificates/canonical-v2.json
      - name: Independent verifier mutation suite
        run: python3 scripts/test-independent-verifier.py
